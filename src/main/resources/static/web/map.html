<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>商城地图选点 - 广州</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        #map { width: 100%; height: 600px; }
        #info {
            padding: 6px;
            background: #f5f5f5;
            border-top: 1px solid #ddd;
        }
    </style>

    <!-- 引入高德地图JS SDK -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=368b024dd353e7b5e0f3fd405d7871c6"></script>
</head>
<body>
<h2 style="padding:4px;">📍 商城地图选点功能（以广州为中心）</h2>
<div id="map"></div>
<div id="info">点击地图选择一个位置。</div>

<script>
    // 初始化地图，中心点为广州
    var map = new AMap.Map('map', {
        zoom: 13,
        center: [113.327, 23.129] // 广州天河区中心点
    });

    var marker;

    // 点击地图选点
    map.on('click', function(e) {
        var lng = e.lnglat.lng;
        var lat = e.lnglat.lat;

        if (marker) marker.setMap(null); // 清除上一个标记
        marker = new AMap.Marker({
            position: [lng, lat],
            map: map
        });

        document.getElementById('info').innerText =
            '选中坐标：' + lng.toFixed(6) + ', ' + lat.toFixed(6) + '（正在解析地址...）';

        // 调用后端接口获取详细地址
        fetch(`/api/map/regeo?lng=${lng}&lat=${lat}`)
            .then(res => res.text())
            .then(addr => {
                document.getElementById('info').innerText =
                    '📍 选中地址：' + addr + '（经纬度：' + lng.toFixed(6) + ',' + lat.toFixed(6) + '）';
            });
    });
</script>
</body>
</html>
